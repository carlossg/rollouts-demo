apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: quarkus-demo

resources:
  - github.com/carlossg/progressive-delivery/workloads/quarkus-rollouts-demo/base?ref=main
  - ingress.yaml

patches:
  # Point GitHub issue creation at carlossg's fork, since even the fork's own
  # manifests still reference the kdubois upstream repo
  - target:
      kind: AnalysisTemplate
      name: ai-analysis-agent
    patch: |-
      - op: replace
        path: /spec/metrics/0/provider/plugin/argoproj-labs~1metric-ai/githubUrl
        value: https://github.com/carlossg/argo-rollouts-quarkus-demo

  # Route (route.openshift.io) doesn't exist on GKE - drop it
  - patch: |-
      $patch: delete
      apiVersion: route.openshift.io/v1
      kind: Route
      metadata:
        name: quarkus-demo
        namespace: quarkus-demo

  # RBAC for the argoproj-labs/openshift trafficRouting plugin, which this
  # cluster's Argo Rollouts controller doesn't have registered - drop it
  - patch: |-
      $patch: delete
      apiVersion: rbac.authorization.k8s.io/v1
      kind: Role
      metadata:
        name: argo-rollouts-plugin
        namespace: quarkus-demo
  - patch: |-
      $patch: delete
      apiVersion: rbac.authorization.k8s.io/v1
      kind: RoleBinding
      metadata:
        name: argo-rollouts-plugin
        namespace: quarkus-demo

  # Drop trafficRouting.plugins.argoproj-labs/openshift - falls back to plain
  # canary weights + services, same as this repo's own canary-demo rollout
  - target:
      kind: Rollout
      name: quarkus-demo
    patch: |-
      - op: remove
        path: /spec/strategy/canary/trafficRouting
