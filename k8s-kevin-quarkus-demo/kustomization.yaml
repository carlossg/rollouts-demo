apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: quarkus-demo

resources:
  - github.com/carlossg/progressive-delivery/workloads/quarkus-rollouts-demo/base?ref=main
  - ingress.yaml
  - backendconfig.yaml

patches:
  # /api/agent/events/stream is a long-lived SSE endpoint; GCE's default 30s
  # backend timeout kills it mid-stream (ERR_INCOMPLETE_CHUNKED_ENCODING) -
  # point both services at a BackendConfig with a much longer timeout
  - target:
      kind: Service
      name: quarkus-demo-stable
    patch: |-
      - op: add
        path: /metadata/annotations
        value:
          cloud.google.com/backend-config: '{"default": "quarkus-demo-backendconfig"}'
  - target:
      kind: Service
      name: quarkus-demo-canary
    patch: |-
      - op: add
        path: /metadata/annotations
        value:
          cloud.google.com/backend-config: '{"default": "quarkus-demo-backendconfig"}'

  # Point GitHub issue creation at carlossg's fork, since even the fork's own
  # manifests still reference the kdubois upstream repo
  - target:
      kind: AnalysisTemplate
      name: ai-analysis-agent
    patch: |-
      - op: replace
        path: /spec/metrics/0/provider/plugin/argoproj-labs~1metric-ai/githubUrl
        value: https://github.com/carlossg/argo-rollouts-quarkus-demo

  # Route (route.openshift.io) doesn't exist on GKE - drop it
  - patch: |-
      $patch: delete
      apiVersion: route.openshift.io/v1
      kind: Route
      metadata:
        name: quarkus-demo
        namespace: quarkus-demo

  # RBAC for the argoproj-labs/openshift trafficRouting plugin, which this
  # cluster's Argo Rollouts controller doesn't have registered - drop it
  - patch: |-
      $patch: delete
      apiVersion: rbac.authorization.k8s.io/v1
      kind: Role
      metadata:
        name: argo-rollouts-plugin
        namespace: quarkus-demo
  - patch: |-
      $patch: delete
      apiVersion: rbac.authorization.k8s.io/v1
      kind: RoleBinding
      metadata:
        name: argo-rollouts-plugin
        namespace: quarkus-demo

  # Drop trafficRouting.plugins.argoproj-labs/openshift - falls back to plain
  # canary weights + services, same as this repo's own canary-demo rollout
  - target:
      kind: Rollout
      name: quarkus-demo
    patch: |-
      - op: remove
        path: /spec/strategy/canary/trafficRouting

  # Pin the steady-state image to the known-good v1.stable. Upstream's base
  # hardcodes v3.memoryleak, so without this override every `kubectl apply -k`
  # (even for unrelated changes) resets the image and re-triggers a canary
  # against the broken memory-leak build. Switch scenarios imperatively via
  # `kubectl argo rollouts set image` instead of editing this file.
  - target:
      kind: Rollout
      name: quarkus-demo
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/image
        value: ghcr.io/kdubois/argo-rollouts-quarkus-demo:v1.stable

  # Without this, the app falls back to its baked-in default
  # (http://kubernetes-agent.openshift-gitops.svc.cluster.local:8080), a
  # namespace that doesn't exist here - the app's own dashboard activity feed
  # (/api/agent/events) silently fails to reach the agent (caught exception,
  # trace-level log) and shows "Waiting for agent activity..." forever, even
  # during a real rollout, since the AnalysisTemplate's own agentUrl is a
  # separate, correctly-configured code path.
  - target:
      kind: Rollout
      name: quarkus-demo
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: KUBERNETES_AGENT_URL
          value: http://kubernetes-agent.argo-rollouts.svc.cluster.local:8080
