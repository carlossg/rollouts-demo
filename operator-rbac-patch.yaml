apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: argo-rollouts-manager-manager-role-patch
rules:
  - apiGroups: [""]
    resources: ["deployments", "podtemplates"]
    verbs: ["update", "patch"]
  - apiGroups: ["traefik.io"]
    resources: ["traefikservices"]
    verbs: ["watch", "get", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: argo-rollouts-manager-manager-role-patch-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: argo-rollouts-manager-manager-role-patch
subjects:
  - kind: ServiceAccount
    name: argo-rollouts-manager-controller-manager
    namespace: argo-rollouts-manager-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: argo-rollouts-controller-patch
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: argo-rollouts-controller-patch-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: argo-rollouts-controller-patch
subjects:
  - kind: ServiceAccount
    name: argo-rollouts
    namespace: argo-rollouts
