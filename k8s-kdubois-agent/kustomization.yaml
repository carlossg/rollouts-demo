apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: argo-rollouts
resources:
  - github.com/carlossg/progressive-delivery/system/kubernetes-agent?ref=main

patches:
  - path: configmap-model-patch.yaml
    target:
      kind: ConfigMap
      name: kubernetes-agent-config

# Use our own fork's latest main build (fixes thought_signature errors on
# remediation's multi-turn tool use - see carlossg/kubernetes-aiops-agent#5 -
# and the repo-clone-cache ref-naming bug - see #4).
images:
  - name: ghcr.io/kdubois/kubernetes-agent
    newName: ghcr.io/carlossg/kubernetes-aiops-agent
    newTag: main
